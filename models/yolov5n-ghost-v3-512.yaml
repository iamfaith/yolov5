# Parameters
nc: 1  # number of classes
depth_multiple: 0.33  # model depth multiple
width_multiple: 0.25  # layer channel multiple
anchors:
  - [10,13, 16,30, 33,23]  # P3/8
  - [30,61, 62,45, 59,119]  # P4/16
  - [116,90, 156,198, 373,326]  # P5/32


backbone:
  [[-1, 1, Conv, [32, 3, 2]],        # 0-P1/2 (原16 → 32)
   [-1, 1, GhostConv, [64, 3, 2]],   # 1-P2/4 (原32 → 64)
   [-1, 3, C3Ghost, [64]],

   [-1, 1, GhostConv, [128, 3, 2]],  # 3-P3/8 (原64 → 128)
   [-1, 6, C3Ghost, [128]],

   [-1, 1, GhostConv, [256, 3, 2]],  # 5-P4/16 (原128 → 256)
   [-1, 6, C3Ghost, [256]],

   [-1, 1, GhostConv, [512, 3, 2]],  # 7-P5/32 (原192 → 512)
   [-1, 3, C3Ghost, [512]],          # 增加层数以匹配更大容量
  ]


head:
  [[-1, 1, GhostConv, [256, 1, 1]],   # 原96 → 256
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 6], 1, Concat, [1]],  
   [-1, 3, C3Ghost, [256, False]],    # P4

   [-1, 1, GhostConv, [128, 1, 1]],   # 原48 → 128
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 4], 1, Concat, [1]],  
   [-1, 3, C3Ghost, [128, False]],    # P3 (small)

   [-1, 1, GhostConv, [256, 3, 2]],   # 原64 → 256
   [[-1, 13], 1, Concat, [1]],  
   [-1, 3, C3Ghost, [256, False]],    # P4 (medium)

   [-1, 1, GhostConv, [512, 3, 2]],   # 原128 → 512
   [[-1, 8], 1, Concat, [1]],  
   [-1, 3, C3Ghost, [512, False]],    # P5 (large)

   [[14, 17, 20], 1, Detect, [nc, anchors]],  # Detect(P3, P4, P5)
  ]


# Parameters
nc: 1  # number of classes
depth_multiple: 0.33  # model depth multiple
width_multiple: 0.25  # layer channel multiple
anchors:
  - [10,13, 16,30, 33,23]  # P3/8
  - [30,61, 62,45, 59,119]  # P4/16
  - [116,90, 156,198, 373,326]  # P5/32


backbone:
  [[-1, 1, Conv, [32, 3, 2]],        # 0-P1/2 (原16 → 32)
   [-1, 1, GhostConv, [64, 3, 2]],   # 1-P2/4 (原32 → 64)
   [-1, 3, C3Ghost, [64]],

   [-1, 1, GhostConv, [128, 3, 2]],  # 3-P3/8 (原64 → 128)
   [-1, 6, C3Ghost, [128]],

   [-1, 1, GhostConv, [256, 3, 2]],  # 5-P4/16 (原128 → 256)
   [-1, 6, C3Ghost, [256]],

   [-1, 1, GhostConv, [512, 3, 2]],  # 7-P5/32 (原192 → 512)
   [-1, 3, C3Ghost, [512]],

   [-1, 1, GhostConv, [1024, 3, 2]], # 新增一层，扩大到 1024
   [-1, 3, C3Ghost, [1024]],         # 保持较少层数，但通道更大
  ]


head:
  [[-1, 1, GhostConv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 8], 1, Concat, [1]],   # 对应 backbone 的 P4
   [-1, 3, C3Ghost, [512, False]],

   [-1, 1, GhostConv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 5], 1, Concat, [1]],   # 对应 backbone 的 P3
   [-1, 3, C3Ghost, [256, False]],

   [-1, 1, GhostConv, [512, 3, 2]],
   [[-1, 13], 1, Concat, [1]],  # 对应 head 的 P4
   [-1, 3, C3Ghost, [512, False]],

   [-1, 1, GhostConv, [1024, 3, 2]],
   [[-1, 10], 1, Concat, [1]],  # 对应 backbone 的 P5
   [-1, 3, C3Ghost, [1024, False]],

   [[14, 17, 20], 1, Detect, [nc, anchors]],
  ]



